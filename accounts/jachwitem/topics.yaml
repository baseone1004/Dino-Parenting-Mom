# 자취템 계정 주제 목록 — 순서대로 순환. 끝나면 처음부터.
#   title   : 글 주제 (구체적일수록 좋음)
#   angle   : 어떤 감정/관점으로
#   product : 상품 이름 (경험담으로 언급). 링크는 아래 link 에.
#   link    : 쿠팡 파트너스(또는 토스쇼핑 쉐어링크) 에서 만든 링크 붙여넣기. 비우면 링크 없이 게시.
#
# 팁: 처음 2주(config 의 link_after_days)는 링크가 붙지 않으니 그동안 링크를 천천히 채워도 됨.

