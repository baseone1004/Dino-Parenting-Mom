    topic_order: sequential
    started_at: "2026-09-27"
    link_after_days: 0     # 토스 승인 완료, 링크도 채워짐 (2026-09-28) — 처음부터 링크 댓글 달기
    link_source: toss       # product: AUTO 인 주제는 토스 트렌드 상품을 자동으로 뽑아 링크 발급
